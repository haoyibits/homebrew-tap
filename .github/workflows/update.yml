name: Update formulae

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [tracebridge-release]

permissions:
  contents: write

jobs:
  formulae:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate Formula/rvdbg.rb from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: haoyibits/rustvisor-debug
        run: |
          if ! tag=$(gh release view --repo "$REPO" --json tagName --jq .tagName 2>/dev/null); then
            echo "no release yet"
            exit 0
          fi
          version="${tag#v}"
          mkdir -p dist Formula
          gh release download "$tag" --repo "$REPO" --pattern '*.sha256' --dir dist
          curl -fsSL "https://raw.githubusercontent.com/$REPO/main/packaging/homebrew/formula.sh" -o formula.sh
          changed=""
          # Releases ship only rvdbg after 0.1.20; Formula/tracebridge.rb stays
          # at 0.1.20, the last release with tracebridge archives.
          for program in rvdbg; do
            if ! ls dist/"$program"-*.tar.gz.sha256 >/dev/null 2>&1; then
              echo "$tag has no $program archives"
              continue
            fi
            sh formula.sh "$version" dist "$REPO" "$program" > "Formula/$program.rb"
            ruby -c "Formula/$program.rb"
            if git diff --quiet -- "Formula/$program.rb" && git ls-files --error-unmatch "Formula/$program.rb" >/dev/null 2>&1; then
              echo "Formula/$program.rb is up to date"
              continue
            fi
            git add "Formula/$program.rb"
            changed="$changed $program"
          done
          if [ -z "$changed" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$(echo $changed | sed 's/ /, /g') $version"
          git push
